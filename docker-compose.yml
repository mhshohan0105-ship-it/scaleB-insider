# Optional: local MariaDB via Docker (the dev machine uses a native MariaDB 10.11 service on 3307).
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: devroot
      MARIADB_DATABASE: scaleb_insider
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
volumes:
  dbdata:
