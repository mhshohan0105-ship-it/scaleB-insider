# Production stack: app + MariaDB + nightly database dump (DEPLOYMENT.md).
# Put secrets in a .env file next to this file; never commit it.
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_USER: scaleb
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
      MARIADB_DATABASE: scaleb_insider
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://scaleb:${DB_PASSWORD}@db:3306/scaleb_insider
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      APP_URL: ${APP_URL:?set APP_URL}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
      SMS_URL_TEMPLATE: ${SMS_URL_TEMPLATE:-}
      SMS_METHOD: ${SMS_METHOD:-GET}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-}
      SMS_SUCCESS_REGEX: ${SMS_SUCCESS_REGEX:-}
    ports:
      - "127.0.0.1:3000:3000" # behind a TLS reverse proxy (Caddy / nginx)

  # Daily mariadb-dump at 02:00 Dhaka, 14 days kept, in ./backups.
  backup:
    image: mariadb:10.11
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${DB_PASSWORD}
      TZ: Asia/Dhaka
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        now=$$(date +%H%M);
        if [ "$$now" = "0200" ]; then
          mariadb-dump -h db -u scaleb --single-transaction --routines scaleb_insider | gzip > /backups/scaleb-$$(date +%Y%m%d).sql.gz &&
          find /backups -name "scaleb-*.sql.gz" -mtime +14 -delete;
          sleep 60;
        fi;
        sleep 30;
      done'

volumes:
  dbdata:
